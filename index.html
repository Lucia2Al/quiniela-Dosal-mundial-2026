<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>&#x26BD; Quiniela Dosal &middot; Mundial 2026</title>
<style>
  :root {
    --green: #1a6b3c;
    --green-light: #2a8a50;
    --green-dark: #124d2b;
    --gold: #f0c040;
    --gold-dark: #c9a030;
    --silver: #b0b8c0;
    --bronze: #cd7f32;
    --bg: #f4f6f8;
    --card: #ffffff;
    --text: #1a1a2e;
    --text-muted: #6b7280;
    --border: #e5e7eb;
    --exact: #16a34a;
    --exact-bg: #dcfce7;
    --correct: #d97706;
    --correct-bg: #fef3c7;
    --wrong: #dc2626;
    --wrong-bg: #fee2e2;
    --pending: #9ca3af;
    --pending-bg: #f3f4f6;
    --radius: 12px;
    --shadow: 0 2px 8px rgba(0,0,0,0.08);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }
  header { background: var(--green); color: white; padding: 16px 20px; text-align: center; position: sticky; top: 0; z-index: 100; box-shadow: 0 2px 12px rgba(0,0,0,0.2); }
  header h1 { font-size: 1.25rem; font-weight: 700; letter-spacing: 0.5px; }
  header p { font-size: 0.75rem; opacity: 0.8; margin-top: 2px; }
  .tab-bar { background: var(--green-dark); display: flex; overflow-x: auto; scrollbar-width: none; position: sticky; top: 72px; z-index: 99; border-bottom: 3px solid var(--gold); }
  .tab-bar::-webkit-scrollbar { display: none; }
  .tab-btn { flex: 0 0 auto; padding: 12px 18px; color: rgba(255,255,255,0.7); font-size: 0.8rem; font-weight: 600; cursor: pointer; border: none; background: none; white-space: nowrap; transition: all 0.2s; border-bottom: 3px solid transparent; margin-bottom: -3px; letter-spacing: 0.3px; }
  .tab-btn:hover { color: white; background: rgba(255,255,255,0.08); }
  .tab-btn.active { color: var(--gold); border-bottom-color: var(--gold); }
  .tab-content { display: none; padding: 16px; max-width: 900px; margin: 0 auto; }
  .tab-content.active { display: block; }

  /* Podium */
  .podium { display: flex; gap: 12px; margin-bottom: 20px; align-items: flex-end; justify-content: center; }
  .podium-card { flex: 1; max-width: 200px; background: var(--card); border-radius: var(--radius); padding: 16px 12px; text-align: center; box-shadow: var(--shadow); border: 2px solid transparent; }
  .podium-card.p1 { border-color: var(--gold); order: 2; }
  .podium-card.p2 { border-color: var(--silver); order: 1; }
  .podium-card.p3 { border-color: var(--bronze); order: 3; }
  .podium-medal { font-size: 2rem; display: block; }
  .podium-name { font-size: 1.1rem; font-weight: 700; margin: 4px 0; }
  .podium-pts { font-size: 1.8rem; font-weight: 800; }
  .podium-card.p1 .podium-pts { color: var(--gold-dark); }
  .podium-card.p2 .podium-pts { color: #7a8899; }
  .podium-card.p3 .podium-pts { color: var(--bronze); }
  .podium-sub { font-size: 0.7rem; color: var(--text-muted); margin-top: 2px; }

  /* Table */
  .standings-table { background: var(--card); border-radius: var(--radius); overflow-x: auto; box-shadow: var(--shadow); }
  table { width: 100%; border-collapse: collapse; }
  thead { background: var(--green); color: white; }
  th { padding: 12px 10px; text-align: left; font-size: 0.75rem; font-weight: 600; letter-spacing: 0.5px; text-transform: uppercase; }
  th:nth-child(n+3) { text-align: center; }
  td { padding: 12px 10px; font-size: 0.85rem; border-bottom: 1px solid var(--border); }
  td:nth-child(n+3) { text-align: center; }
  tr:last-child td { border-bottom: none; }
  tr:hover td { background: #f9fafb; }
  .rank-badge { display: inline-flex; align-items: center; justify-content: center; width: 26px; height: 26px; border-radius: 50%; font-weight: 700; font-size: 0.8rem; }
  .rank-1 { background: var(--gold); color: var(--green-dark); }
  .rank-2 { background: var(--silver); color: #333; }
  .rank-3 { background: var(--bronze); color: white; }
  .pts-big { font-weight: 800; font-size: 1rem; color: var(--green); }
  .bonus-note { background: #fff8e6; border: 1px solid var(--gold); border-radius: 8px; padding: 10px 14px; font-size: 0.8rem; color: #92600a; margin-bottom: 16px; }

  /* Day chips */
  .day-chips { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 8px; margin-bottom: 16px; scrollbar-width: none; }
  .day-chips::-webkit-scrollbar { display: none; }
  .day-chip { flex: 0 0 auto; padding: 7px 14px; border-radius: 20px; font-size: 0.78rem; font-weight: 600; cursor: pointer; border: 2px solid var(--border); background: white; color: var(--text-muted); transition: all 0.2s; }
  .day-chip:hover { border-color: var(--green); color: var(--green); }
  .day-chip.active { background: var(--green); border-color: var(--green); color: white; }

  /* Match cards */
  .match-card { background: var(--card); border-radius: var(--radius); padding: 14px; margin-bottom: 12px; box-shadow: var(--shadow); border-left: 4px solid var(--border); }
  .match-card.has-result { border-left-color: var(--green); }
  .match-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
  .match-id { font-size: 0.7rem; color: var(--text-muted); font-weight: 600; }
  .match-group { font-size: 0.7rem; background: var(--green); color: white; padding: 2px 8px; border-radius: 10px; }
  .match-score { text-align: center; margin-bottom: 10px; }
  .match-teams { font-size: 1rem; font-weight: 700; display: flex; align-items: center; justify-content: center; gap: 12px; }
  .match-result-score { background: var(--green); color: white; padding: 4px 14px; border-radius: 20px; font-size: 1.1rem; font-weight: 800; }
  .match-pending-score { color: var(--text-muted); font-size: 0.9rem; }
  .predictions-grid { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
  .pred-chip { padding: 4px 10px; border-radius: 12px; font-size: 0.75rem; font-weight: 600; }
  .pred-exact { background: var(--exact-bg); color: var(--exact); }
  .pred-correct { background: var(--correct-bg); color: var(--correct); }
  .pred-wrong { background: var(--wrong-bg); color: var(--wrong); }
  .pred-pending { background: var(--pending-bg); color: var(--pending); }

  /* Player tab */
  .player-select-wrap { margin-bottom: 20px; }
  .player-select-wrap select { padding: 10px 14px; border-radius: 8px; border: 2px solid var(--border); font-size: 0.9rem; font-weight: 600; background: white; cursor: pointer; width: 100%; max-width: 300px; }
  .player-summary { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 20px; }
  .summary-card { flex: 1; min-width: 80px; background: var(--card); border-radius: var(--radius); padding: 14px; text-align: center; box-shadow: var(--shadow); }
  .summary-card .val { font-size: 1.8rem; font-weight: 800; color: var(--green); }
  .summary-card .lbl { font-size: 0.7rem; color: var(--text-muted); margin-top: 2px; }
  .player-matches-table { background: var(--card); border-radius: var(--radius); overflow: hidden; box-shadow: var(--shadow); overflow-x: auto; }
  .row-exact td { background: var(--exact-bg); }
  .row-correct td { background: var(--correct-bg); }
  .row-wrong td { background: var(--wrong-bg); }
  .player-bonus-section { background: var(--card); border-radius: var(--radius); padding: 16px; margin-top: 16px; box-shadow: var(--shadow); }
  .player-bonus-section h3 { font-size: 0.85rem; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 12px; }
  .bonus-row { display: flex; justify-content: space-between; align-items: center; padding: 10px 0; border-bottom: 1px solid var(--border); font-size: 0.85rem; }
  .bonus-row:last-child { border-bottom: none; }
  .bonus-pick { font-weight: 600; }
  .bonus-pts { font-weight: 800; font-size: 1rem; }
  .bonus-pts.won { color: var(--exact); }
  .bonus-pts.lost { color: var(--wrong); }
  .bonus-pts.pending { color: var(--pending); }

  /* Champion / Scorer */
  .pick-card { background: var(--card); border-radius: var(--radius); padding: 14px 16px; margin-bottom: 10px; box-shadow: var(--shadow); display: flex; align-items: center; gap: 12px; }
  .pick-card.winner { border: 2px solid var(--gold); background: #fffbec; }
  .pick-bar-wrap { flex: 1; }
  .pick-team { font-weight: 700; font-size: 0.95rem; margin-bottom: 4px; }
  .pick-bar-bg { background: var(--border); border-radius: 10px; height: 8px; overflow: hidden; }
  .pick-bar-fill { background: var(--green); height: 8px; border-radius: 10px; }
  .pick-card.winner .pick-bar-fill { background: var(--gold-dark); }
  .pick-pct { font-size: 0.85rem; font-weight: 700; color: var(--text-muted); white-space: nowrap; text-align: center; }
  .pick-names { font-size: 0.72rem; color: var(--text-muted); margin-top: 4px; }

  /* Scorers */
  .scorers-section { background: var(--card); border-radius: var(--radius); padding: 16px; margin-top: 20px; box-shadow: var(--shadow); }
  .scorers-section h3 { font-size: 0.9rem; font-weight: 700; margin-bottom: 12px; }
  .scorer-row { display: flex; align-items: center; gap: 10px; padding: 8px 0; border-bottom: 1px solid var(--border); }
  .scorer-row:last-child { border-bottom: none; }
  .scorer-name-input { flex: 1; padding: 6px 10px; border: 1px solid var(--border); border-radius: 6px; font-size: 0.85rem; }
  .scorer-goals-input { width: 60px; padding: 6px 8px; border: 1px solid var(--border); border-radius: 6px; font-size: 0.85rem; text-align: center; }
  .btn-remove { background: var(--wrong-bg); color: var(--wrong); border: none; border-radius: 6px; padding: 6px 10px; cursor: pointer; font-size: 0.8rem; font-weight: 600; }
  .btn-add { background: var(--green); color: white; border: none; border-radius: 8px; padding: 8px 16px; cursor: pointer; font-size: 0.85rem; font-weight: 600; margin-top: 10px; }

  /* Rules */
  .rules-card { background: var(--card); border-radius: var(--radius); padding: 20px; box-shadow: var(--shadow); }
  .rules-card h2 { font-size: 1.1rem; margin-bottom: 16px; color: var(--green); }
  .rule-item { display: flex; gap: 12px; padding: 14px 0; border-bottom: 1px solid var(--border); align-items: flex-start; }
  .rule-item:last-child { border-bottom: none; }
  .rule-icon { font-size: 1.5rem; flex-shrink: 0; }
  .rule-title { font-weight: 700; font-size: 0.9rem; margin-bottom: 4px; }
  .rule-desc { font-size: 0.82rem; color: var(--text-muted); line-height: 1.6; }
  .pts-badge { display: inline-block; padding: 2px 8px; border-radius: 10px; font-weight: 700; font-size: 0.8rem; margin-right: 4px; }
  .pts-3 { background: var(--exact-bg); color: var(--exact); }
  .pts-1 { background: var(--correct-bg); color: var(--correct); }
  .pts-0 { background: var(--wrong-bg); color: var(--wrong); }
  .pts-10 { background: var(--gold); color: var(--green-dark); }
  .pts-5 { background: #e0f2fe; color: #0369a1; }
  .entry-fee { margin-top: 16px; background: var(--green); color: white; border-radius: var(--radius); padding: 14px 16px; text-align: center; font-size: 1.1rem; font-weight: 700; }

  /* Admin */
  .admin-lock { background: var(--card); border-radius: var(--radius); padding: 24px; text-align: center; box-shadow: var(--shadow); max-width: 360px; margin: 40px auto; }

  /* Mobile */
  @media (max-width: 600px) {
    header h1 { font-size: 1.05rem; }
    .tab-content { padding: 12px; }
    .podium { gap: 6px; }
    .podium-card { padding: 10px 6px; }
    .podium-name { font-size: 0.85rem; }
    .podium-pts { font-size: 1.3rem; }
    .podium-sub { font-size: 0.62rem; }
    th, td { padding: 8px 5px; font-size: 0.72rem; }
    .pts-big { font-size: 0.9rem; }
    .match-teams { font-size: 0.85rem; gap: 6px; }
    .match-result-score { padding: 3px 10px; font-size: 1rem; }
    .player-summary { gap: 6px; }
    .summary-card { min-width: 58px; padding: 10px 6px; }
    .summary-card .val { font-size: 1.3rem; }
    .result-row { flex-wrap: wrap; gap: 6px; }
    .result-match-label { width: 100%; }
    .score-input { width: 44px; }
    .bonus-admin-row { flex-direction: column; }
    .bonus-admin-row input { min-width: unset; width: 100%; }
  }
  .admin-lock h2 { font-size: 1.1rem; margin-bottom: 8px; }
  .admin-lock p { font-size: 0.85rem; color: var(--text-muted); margin-bottom: 16px; }
  .pw-input { width: 100%; padding: 10px 14px; border: 2px solid var(--border); border-radius: 8px; font-size: 0.95rem; margin-bottom: 12px; text-align: center; letter-spacing: 2px; }
  .pw-input:focus { outline: none; border-color: var(--green); }
  .btn-primary { width: 100%; padding: 10px; background: var(--green); color: white; border: none; border-radius: 8px; font-size: 0.95rem; font-weight: 700; cursor: pointer; }
  .btn-primary:hover { background: var(--green-light); }
  .pw-error { color: var(--wrong); font-size: 0.82rem; margin-top: 8px; }
  .admin-section { background: var(--card); border-radius: var(--radius); padding: 16px; margin-bottom: 16px; box-shadow: var(--shadow); }
  .admin-section h3 { font-size: 0.85rem; font-weight: 700; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 14px; padding-bottom: 8px; border-bottom: 1px solid var(--border); }
  .result-row { display: flex; align-items: center; gap: 8px; padding: 8px 0; border-bottom: 1px solid var(--border); flex-wrap: wrap; }
  .result-row:last-child { border-bottom: none; }
  .result-match-label { flex: 1; font-size: 0.78rem; font-weight: 600; min-width: 140px; }
  .score-input { width: 50px; padding: 6px 8px; border: 1px solid var(--border); border-radius: 6px; font-size: 0.85rem; text-align: center; }
  .score-input.filled { border-color: var(--exact); background: var(--exact-bg); }
  .score-sep { font-weight: 700; color: var(--text-muted); }
  .btn-save-result { padding: 6px 12px; background: var(--green); color: white; border: none; border-radius: 6px; font-size: 0.78rem; font-weight: 700; cursor: pointer; white-space: nowrap; }
  .btn-save-result:hover { background: var(--green-light); }
  .admin-results-scroll { max-height: 500px; overflow-y: auto; }
  .bonus-admin-row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  .bonus-admin-row input { flex: 1; padding: 8px 12px; border: 2px solid var(--border); border-radius: 8px; font-size: 0.9rem; min-width: 180px; }
  .bonus-admin-row input:focus { outline: none; border-color: var(--green); }
  .btn-danger { padding: 10px 16px; background: var(--wrong); color: white; border: none; border-radius: 8px; font-size: 0.9rem; font-weight: 700; cursor: pointer; margin-right: 8px; }
  .btn-export { padding: 10px 16px; background: #1d4ed8; color: white; border: none; border-radius: 8px; font-size: 0.9rem; font-weight: 700; cursor: pointer; }
  .section-title { font-size: 0.75rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; color: var(--text-muted); margin-bottom: 12px; }

  /* Toast */
  .toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%) translateY(100px); background: #1a1a2e; color: white; padding: 10px 20px; border-radius: 20px; font-size: 0.85rem; font-weight: 600; z-index: 999; transition: transform 0.3s; pointer-events: none; }
  .toast.show { transform: translateX(-50%) translateY(0); }

  @media (max-width: 480px) {
    .podium { gap: 8px; }
    .podium-card { padding: 12px 8px; }
    .podium-name { font-size: 0.9rem; }
    .podium-pts { font-size: 1.4rem; }
    th, td { padding: 8px 6px; font-size: 0.76rem; }
    .tab-content { padding: 10px; }
  }
</style>
</head>

function getResults() {
  var stored = localStorage.getItem('quiniela_2026_results');
  if (!stored) {
    var init = JSON.parse(JSON.stringify(INITIAL_RESULTS));
    localStorage.setItem('quiniela_2026_results', JSON.stringify(init));
    return init;
  }
  return JSON.parse(stored);
}

function saveResults(r) { localStorage.setItem('quiniela_2026_results', JSON.stringify(r)); }

function getBonus() {
  var s = localStorage.getItem('quiniela_2026_bonus');
  return s ? JSON.parse(s) : {campeon:null, goleador:null};
}

function saveBonus(b) { localStorage.setItem('quiniela_2026_bonus', JSON.stringify(b)); }

function getScorers() {
  var s = localStorage.getItem('quiniela_2026_scorers');
  return s ? JSON.parse(s) : [];
}

function saveScorers(sc) { localStorage.setItem('quiniela_2026_scorers', JSON.stringify(sc)); }

// ============================================================
// SCORING
// ============================================================

function matchDir(h, a) { return h > a ? 'H' : (a > h ? 'A' : 'D'); }

function scoreMatch(pred, real) {
  if (!real) return null;
  if (pred[0] === real[0] && pred[1] === real[1]) return 3;
  if (matchDir(pred[0], pred[1]) === matchDir(real[0], real[1])) return 1;
  return 0;
}

function calcStandings() {
  var results = getResults();
  var bonus = getBonus();
  return PARTICIPANTS.map(function(p) {
    var matchPts = 0, exact = 0, correct = 0, wrong = 0, played = 0;
    MATCHES.forEach(function(m) {
      var real = results[m.id];
      var pred = PREDICTIONS[p] && PREDICTIONS[p][m.id];
      if (!real || !pred) return;
      played++;
      var s = scoreMatch(pred, real);
      matchPts += s;
      if (s === 3) exact++;
      else if (s === 1) correct++;
      else wrong++;
    });
    var bCamp = 0, bGol = 0;
    var bp = BONUS_PICKS[p];
    if (bonus.campeon && bp && bonus.campeon.toLowerCase().trim() === bp.campeon.toLowerCase().trim()) bCamp = 10;
    if (bonus.goleador && bp && bonus.goleador.toLowerCase().trim() === bp.goleador.toLowerCase().trim()) bGol = 5;
    return {p:p, matchPts:matchPts, bCamp:bCamp, bGol:bGol, total:matchPts+bCamp+bGol, exact:exact, correct:correct, wrong:wrong, played:played};
  }).sort(function(a,b){ return b.total-a.total || b.exact-a.exact || b.correct-a.correct; });
}

var activeTab = 'tabla';

function showTab(tab) {
  var tabs = ['tabla','partidos','jugadores','campeon','goleador','reglas','admin'];
  var btns = document.querySelectorAll('.tab-btn');
  btns.forEach(function(b, i) { b.classList.toggle('active', tabs[i] === tab); });
  document.querySelectorAll('.tab-content').forEach(function(c) { c.classList.remove('active'); });
  document.getElementById('tab-' + tab).classList.add('active');
  activeTab = tab;
  renderTab(tab);
}

function renderTab(tab) {
  if (tab==='tabla') renderTabla();
  else if (tab==='partidos') renderPartidos();
  else if (tab==='jugadores') renderJugadores();
  else if (tab==='campeon') renderCampeon();
  else if (tab==='goleador') renderGoleador();
  else if (tab==='reglas') renderReglas();
  else if (tab==='admin') renderAdmin();
}

// ============================================================

function renderTabla() {
  var standings = calcStandings();
  var bonus = getBonus();
  var bonusPending = !bonus.campeon || !bonus.goleador;
  var html = '';

  if (bonusPending) {
    html += '<div class="bonus-note">&#x2139;&#xFE0F; Los bonus de campeón (+10 pts) y/o goleador (+5 pts) aún no han sido asignados. Los puntos son parciales.</div>';
  }

  // Agrupar empates para el podio
  var groups = [];
  standings.forEach(function(s) {
    var last = groups[groups.length-1];
    if (last && last.total === s.total) { last.members.push(s); }
    else { groups.push({total: s.total, members: [s]}); }
  });

  var medals = ['🥇','🥈','🥉'];
  var pcls = ['p1','p2','p3'];
  html += '<div class="podium">';
  groups.slice(0,3).forEach(function(g,i) {
    var names = g.members.map(function(m){ return m.p; }).join(' · ');
    var s = g.members[0];
    html += '<div class="podium-card '+pcls[i]+'">'
      + '<span class="podium-medal">'+medals[i]+'</span>'
      + '<div class="podium-name">'+names+'</div>'
      + '<div class="podium-pts">'+g.total+'</div>'
      + '<div class="podium-sub">'+s.exact+' exactos &middot; '+s.correct+' ganador</div>'
      + '</div>';
  });
  html += '</div>';

  html += '<div class="standings-table"><table><thead><tr>'
    + '<th>#</th><th>Nombre</th><th>Pts</th><th>Exactos</th><th>Ganador</th><th>PJ</th>'
    + '</tr></thead><tbody>';

  var rank = 1;
  standings.forEach(function(s,i) {
    if (i > 0 && standings[i].total < standings[i-1].total) rank = i+1;
    var rb;
    if (rank===1) rb = '<span class="rank-badge rank-1">1</span>';
    else if (rank===2) rb = '<span class="rank-badge rank-2">2</span>';
    else if (rank===3) rb = '<span class="rank-badge rank-3">3</span>';
    else rb = '<span style="color:var(--text-muted);font-weight:600">'+rank+'</span>';
    html += '<tr><td>'+rb+'</td><td><strong>'+s.p+'</strong></td>'
      + '<td><span class="pts-big">'+s.total+'</span></td>'
      + '<td>'+s.exact+'</td><td>'+s.correct+'</td><td>'+s.played+'</td></tr>';
  });

  html += '</tbody></table></div>';
  document.getElementById('tab-tabla').innerHTML = html;
}

var selectedDay = '__todos__';

function getTodayStr() {
  var today = new Date();
  var dayN = ['Dom','Lun','Mar','Mié','Jue','Vie','Sáb'];
  var monN = ['','Ene','Feb','Mar','Abr','May','Jun','Jul','Ago','Sep','Oct','Nov','Dic'];
  return dayN[today.getDay()] + ' ' + today.getDate() + ' ' + monN[today.getMonth()];
}

function renderPartidos() {
  var results = getResults();
  var uniqueDays = [];
  MATCHES.forEach(function(m) { if (uniqueDays.indexOf(m.date) < 0) uniqueDays.push(m.date); });

  var todayStr = getTodayStr();
  var todayIsMatch = uniqueDays.indexOf(todayStr) >= 0;

  // Dropdown filter
  var html = '<div style="margin-bottom:16px;">'
    + '<select id="day-select" onchange="selectDay(this.value)" style="width:100%;padding:10px 12px;border-radius:8px;border:1.5px solid var(--border);font-size:0.95rem;background:white;color:var(--text);cursor:pointer;">'
    + '<option value="__todos__"'+(selectedDay==='__todos__'?' selected':'')+'>📅 Todos los partidos</option>';
  uniqueDays.forEach(function(d) {
    var label = d + (d===todayStr ? ' ⬅ hoy' : '');
    html += '<option value="'+d+'"'+(d===selectedDay?' selected':'')+'>'+label+'</option>';
  });
  html += '</select></div>';

  // Build match list: if "todos", show today's matches first, then rest in order
  var matchList;
  if (selectedDay === '__todos__') {
    var todayMatches = MATCHES.filter(function(m){ return m.date===todayStr; })
      .sort(function(a,b){ return a.time.localeCompare(b.time); });
    var otherMatches = MATCHES.filter(function(m){ return m.date!==todayStr; });
    matchList = todayMatches.concat(otherMatches);
    if (todayIsMatch) {
      html += '<div style="font-size:0.8rem;color:var(--green);font-weight:600;margin-bottom:10px;padding:6px 10px;background:#dcfce7;border-radius:6px;">📍 Partidos de hoy arriba</div>';
    }
  } else {
    matchList = MATCHES.filter(function(m){ return m.date===selectedDay; })
      .sort(function(a,b){ return a.time.localeCompare(b.time); });
  }

  var lastDate = null;
  matchList.forEach(function(m) {
    var real = results[m.id];
    var hasResult = !!real;

    // Date separator when showing all
    if (selectedDay === '__todos__' && m.date !== lastDate) {
      var isToday = m.date === todayStr;
      html += '<div style="font-size:0.78rem;font-weight:700;color:'+(isToday?'var(--green)':'var(--text-muted)')+';text-transform:uppercase;letter-spacing:0.5px;margin:'+(lastDate?'20px':'0')+'px 0 8px;">'
        + (isToday ? '⚽ ' : '') + m.date + '</div>';
      lastDate = m.date;
    }

    html += '<div class="match-card '+(hasResult?'has-result':'')+'">'
      + '<div class="match-header">'
      + '<span class="match-id">'+m.id+' &middot; '+m.time+'</span>'
      + '<span class="match-group">Grupo '+m.group+'</span>'
      + '</div>'
      + (m.venue ? '<div style="font-size:0.72rem;color:var(--text-muted);padding:2px 0 6px;text-align:center;">📍 '+m.venue+'</div>' : '')
      + '<div class="match-score"><div class="match-teams">'
      + '<span>'+m.home+'</span>';
    if (hasResult) {
      html += '<span class="match-result-score">'+real[0]+' &ndash; '+real[1]+'</span>';
    } else {
      html += '<span class="match-pending-score">vs</span>';
    }
    html += '<span>'+m.away+'</span></div></div>';
    html += '<div class="predictions-grid">';
    PARTICIPANTS.forEach(function(p) {
      var pred = PREDICTIONS[p] && PREDICTIONS[p][m.id];
      if (!pred) return;
      var cls, icon;
      if (!hasResult) { cls='pred-pending'; icon=''; }
      else {
        var s = scoreMatch(pred, real);
        if (s===3) { cls='pred-exact'; icon='✓ '; }
        else if (s===1) { cls='pred-correct'; icon='~ '; }
        else { cls='pred-wrong'; icon='✗ '; }
      }
      html += '<span class="pred-chip '+cls+'">'+icon+p+': '+pred[0]+'-'+pred[1]+'</span>';
    });
    html += '</div></div>';
  });

  document.getElementById('tab-partidos').innerHTML = html;
}

function selectDay(day) { selectedDay = day; renderPartidos(); }

  MATCHES.forEach(function(m) {
    var real = results[m.id];
    var pred = PREDICTIONS[p] && PREDICTIONS[p][m.id];
    var rowClass = '', pts = '-';
    if (real && pred) {
      var s = scoreMatch(pred, real);
      if (s===3) rowClass='row-exact';
      else if (s===1) rowClass='row-correct';
      else rowClass='row-wrong';
      pts = s;
    }
    var predStr = pred ? pred[0]+'-'+pred[1] : '-';
    var realStr = real ? real[0]+'-'+real[1] : '-';
    html += '<tr class="'+rowClass+'">'
      + '<td style="font-size:0.72rem;color:var(--text-muted)">'+m.id+'</td>'
      + '<td style="font-size:0.76rem">'+m.home+' vs '+m.away+'</td>'
      + '<td style="font-weight:700;text-align:center">'+predStr+'</td>'
      + '<td style="font-weight:700;text-align:center">'+realStr+'</td>'
      + '<td style="font-weight:800;text-align:center">'+pts+'</td>'
      + '</tr>';
  });
  html += '</tbody></table></div>';

  var campSt = !bonus.campeon ? 'pending' : (bCamp>0?'won':'lost');
  var golSt  = !bonus.goleador ? 'pending' : (bGol>0?'won':'lost');
  var campPts = campSt==='pending' ? '? pts' : (bCamp>0?'+10 pts':'0 pts');
  var golPts  = golSt==='pending'  ? '? pts' : (bGol>0?'+5 pts':'0 pts');

  html += '<div class="player-bonus-section"><h3>Bonus</h3>'
    + '<div class="bonus-row"><span>&#x1F3C6; Campe&oacute;n elegido: <span class="bonus-pick">'+(bp.campeon||'-')+'</span></span><span class="bonus-pts '+campSt+'">'+campPts+'</span></div>'
    + '<div class="bonus-row"><span>&#x1F45F; Goleador elegido: <span class="bonus-pick">'+(bp.goleador||'-')+'</span></span><span class="bonus-pts '+golSt+'">'+golPts+'</span></div>'
    + '</div>';

  document.getElementById('tab-jugadores').innerHTML = html;
}

function renderCampeon() {
  var bonus = getBonus();
  var counts = {};
  PARTICIPANTS.forEach(function(p) {
    var c = BONUS_PICKS[p].campeon;
    if (!counts[c]) counts[c] = [];
    counts[c].push(p);
  });
  var sorted = Object.keys(counts).map(function(k){ return [k, counts[k]]; })
    .sort(function(a,b){ return b[1].length - a[1].length; });
  var total = PARTICIPANTS.length;

  var html = '<p class="section-title">Distribución de picks — Campeón del Mundial</p>';

  sorted.forEach(function(entry) {
    var team = entry[0], pickers = entry[1];
    var pct = Math.round(pickers.length/total*100);
    var isWin = bonus.campeon && bonus.campeon.toLowerCase().trim()===team.toLowerCase().trim();
    html += '<div class="pick-card '+(isWin?'winner':'')+'">'
      + (isWin?'<span style="font-size:1.5rem">&#x1F3C6;</span>':'')
      + '<div class="pick-bar-wrap">'
      + '<div class="pick-team">'+team+(isWin?' &#x2713; Campeón real':'')+'</div>'
      + '<div class="pick-bar-bg"><div class="pick-bar-fill" style="width:'+pct+'%"></div></div>'
      + '<div class="pick-names">'+pickers.join(', ')+'</div>'
      + '</div>'
      + '<div class="pick-pct">'+pickers.length+'/'+total+'<br><small>'+pct+'%</small></div>'
      + '</div>';
  });

  if (!bonus.campeon) html += '<div class="bonus-note">&#x2139;&#xFE0F; El campeón real aún no ha sido registrado en la pestaña Admin.</div>';

  document.getElementById('tab-campeon').innerHTML = html;
}

// TAB 5: GOLEADOR
// ============================================================

function renderGoleador() {
  var bonus = getBonus();
  var scorers = getScorers();
  var counts = {};
  PARTICIPANTS.forEach(function(p) {
    var g = BONUS_PICKS[p].goleador;
    if (!counts[g]) counts[g] = [];
    counts[g].push(p);
  });
  var sorted = Object.keys(counts).map(function(k){ return [k, counts[k]]; })
    .sort(function(a,b){ return b[1].length - a[1].length; });
  var total = PARTICIPANTS.length;

  var html = '<p class="section-title">Distribución de picks — Máximo Goleador</p>';

  sorted.forEach(function(entry) {
    var scorer = entry[0], pickers = entry[1];
    var pct = Math.round(pickers.length/total*100);
    var isWin = bonus.goleador && bonus.goleador.toLowerCase().trim()===scorer.toLowerCase().trim();
    html += '<div class="pick-card '+(isWin?'winner':'')+'">'
      + (isWin?'<span style="font-size:1.5rem">&#x1F45F;</span>':'')
      + '<div class="pick-bar-wrap">'
      + '<div class="pick-team">'+scorer+(isWin?' &#x2713; Goleador real':'')+'</div>'
      + '<div class="pick-bar-bg"><div class="pick-bar-fill" style="width:'+pct+'%"></div></div>'
      + '<div class="pick-names">'+pickers.join(', ')+'</div>'
      + '</div>'
      + '<div class="pick-pct">'+pickers.length+'/'+total+'<br><small>'+pct+'%</small></div>'
      + '</div>';
  });

  if (!bonus.goleador) html += '<div class="bonus-note">&#x2139;&#xFE0F; El goleador real aún no ha sido registrado en la pestaña Admin.</div>';

  // Live scorers
  html += '<div class="scorers-section"><h3>&#x26BD; Tabla de goleadores del torneo</h3><div id="scorers-list">';
  if (scorers.length === 0) {
    html += '<p style="font-size:0.82rem;color:var(--text-muted);padding:8px 0">No hay datos aún. Agrega jugadores con sus goles.</p>';
  } else {
    var sorted2 = scorers.slice().sort(function(a,b){ return (b.goals||0)-(a.goals||0); });
    sorted2.forEach(function(s, i) {
      html += '<div class="scorer-row">'
        + '<span style="font-weight:700;color:var(--text-muted);min-width:24px">'+(i+1)+'.</span>'
        + '<input class="scorer-name-input" value="'+esc(s.name)+'" onchange="updateScorer('+i+',\'name\',this.value)" placeholder="Jugador">'
        + '<input class="scorer-goals-input" type="number" min="0" value="'+(s.goals||0)+'" onchange="updateScorer('+i+',\'goals\',parseInt(this.value)||0)">'
        + '<button class="btn-remove" onclick="removeScorer('+i+')">&#x2715;</button>'
        + '</div>';
    });
  }
  html += '</div><button class="btn-add" onclick="addScorer()">+ Agregar jugador</button></div>';

  document.getElementById('tab-goleador').innerHTML = html;
}

function addScorer() { var sc=getScorers(); sc.push({name:'',goals:0}); saveScorers(sc); renderGoleador(); }
function updateScorer(i,f,v) { var sc=getScorers(); if(sc[i]){sc[i][f]=v; saveScorers(sc);} }

function saveMatchResult(id) {
  var h = document.getElementById('r-'+id+'-h').value.trim();
  var a = document.getElementById('r-'+id+'-a').value.trim();
  if (h==='' || a==='') { showToast('Ingresa ambos valores'); return; }
  var hInt = parseInt(h), aInt = parseInt(a);
  var results = getResults();
  results[id] = [hInt, aInt];
  saveResults(results);
  document.getElementById('r-'+id+'-h').classList.add('filled');
  document.getElementById('r-'+id+'-a').classList.add('filled');
  if (getSyncToken()) {
    showToast(id + ' guardando en servidor...');
    pushResultToGitHub(id, hInt, aInt).then(function(ok) {
      showToast(ok ? id + ' ✓ sincronizado' : id + ' guardado (sin sync)');
    });
  } else {
    showToast(id + ' guardado: ' + h + '–' + a);
  }
}

function saveBonusCampeon() {
  var v = document.getElementById('bonus-campeon').value.trim();
  if (!v) { showToast('Ingresa un campeón'); return; }
  var b = getBonus(); b.campeon = v; saveBonus(b);
  showToast('Campeón guardado: '+v);
  renderAdminPanel();
}

function saveBonusGoleador() {
  var v = document.getElementById('bonus-goleador').value.trim();
  if (!v) { showToast('Ingresa un goleador'); return; }
  var b = getBonus(); b.goleador = v; saveBonus(b);
  showToast('Goleador guardado: '+v);
  renderAdminPanel();
}

function resetAll() {
  if (!confirm('¿Seguro que quieres borrar TODOS los resultados? Esta acción no se puede deshacer.')) return;
  localStorage.removeItem('quiniela_2026_results');
  localStorage.removeItem('quiniela_2026_bonus');
  showToast('Todos los resultados eliminados');
  renderAdminPanel();
}

function exportJSON() {
  var data = { results: getResults(), bonus: getBonus(), exported: new Date().toISOString() };
  var blob = new Blob([JSON.stringify(data, null, 2)], {type:'application/json'});
  var url = URL.createObjectURL(blob);
  var a = document.createElement('a');
  a.href = url;
  a.download = 'quiniela_2026_' + new Date().toISOString().slice(0,10) + '.json';
  a.click();
  URL.revokeObjectURL(url);
}

// ============================================================
// SYNC — resultados remotos vía GitHub
// ============================================================

var GITHUB_REPO = 'Lucia2Al/quiniela-Dosal-mundial-2026';
var RESULTS_PATH = 'resultados.json';

function getSyncToken() { return localStorage.getItem('quiniela_sync_token') || ''; }

async function loadRemoteResults() {
  try {
    var url = 'https://raw.githubusercontent.com/' + GITHUB_REPO + '/main/' + RESULTS_PATH + '?_=' + Date.now();
    var r = await fetch(url);
    if (!r.ok) return;
    var data = await r.json();
    if (!data.partidos) return;
    var stored = getResults();
    var changed = false;
    Object.keys(data.partidos).forEach(function(pid) {
      var res = data.partidos[pid].resultado;
      if (Array.isArray(res)) { stored[pid] = res; changed = true; }
    });
    if (changed) { saveResults(stored); renderTab(activeTab); }
  } catch(e) {}
}

async function pushResultToGitHub(matchId, h, a) {
  var token = getSyncToken();
  if (!token) return false;
  try {
    var apiUrl = 'https://api.github.com/repos/' + GITHUB_REPO + '/contents/' + RESULTS_PATH;
    var r = await fetch(apiUrl, { headers: { 'Authorization': 'token ' + token, 'Accept': 'application/vnd.github.v3+json' }});
    if (!r.ok) return false;
    var fileData = await r.json();
    var decoded = decodeURIComponent(escape(atob(fileData.content.replace(/\n/g,''))));
    var content = JSON.parse(decoded);
    if (content.partidos && content.partidos[matchId]) {
      content.partidos[matchId].resultado = [h, a];
      content._ultima_actualizacion = new Date().toISOString().slice(0, 10);
    }
    var encoded = btoa(unescape(encodeURIComponent(JSON.stringify(content, null, 2))));
    var wr = await fetch(apiUrl, {
      method: 'PUT',
      headers: { 'Authorization': 'token ' + token, 'Content-Type': 'application/json', 'Accept': 'application/vnd.github.v3+json' },
      body: JSON.stringify({ message: 'Resultado ' + matchId + ': ' + h + '-' + a, content: encoded, sha: fileData.sha })
    });
    return wr.ok;
  } catch(e) { return false; }
}

function saveSyncToken() {
  var v = document.getElementById('sync-token-input').value.trim();
  if (v) localStorage.setItem('quiniela_sync_token', v);
  else localStorage.removeItem('quiniela_sync_token');
  showToast('Token ' + (v ? 'guardado' : 'eliminado'));
  renderAdminPanel();
}

async function syncNow() {
  showToast('Sincronizando...');
  await loadRemoteResults();
  showToast('Sincronizado ✓');
}

// UTILS
// ============================================================

function esc(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function showToast(msg) {
  var t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(function(){ t.classList.remove('show'); }, 2500);
}
